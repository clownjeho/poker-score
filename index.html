<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>扑克积分计算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- 顶部导航 -->
  <header class="header">
    <h1 class="title">扑克积分计算</h1>
    <div class="sync-status" id="sync-status">—</div>
  </header>

  <!-- 标签页切换 -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="score">记分</button>
    <button class="tab-btn" data-tab="players">玩家</button>
    <button class="tab-btn" data-tab="summary">统计</button>
  </div>

  <!-- ========== 记分页 ========== -->
  <section id="tab-score" class="tab-content active">
    <!-- 当前庄家和闲家信息 -->
    <div class="current-info">
      <div class="info-card dealer-card">
        <span class="info-label">庄家</span>
        <span class="info-name" id="dealer-name">-</span>
      </div>
      <div class="info-card players-card">
        <span class="info-label">闲家</span>
        <div id="players-list-display" class="players-list-display"></div>
      </div>
    </div>

    <!-- 本局积分总览 -->
    <div class="game-total-bar">
      <div class="game-total-header">本局积分</div>
      <div class="game-total-players" id="game-total-players"></div>
    </div>

    <!-- 选择当前盘数 -->
    <div class="round-selector">
      <label>当前盘数</label>
      <select id="round-select">
        <option value="1">第 1 盘</option>
        <option value="2">第 2 盘</option>
        <option value="3">第 3 盘</option>
        <option value="4">第 4 盘</option>
        <option value="5">第 5 盘</option>
      </select>
    </div>

    <!-- 输入表格 -->
    <div class="input-section">
      <table class="input-table">
        <thead>
          <tr>
            <th>玩家</th>
            <th>积分</th>
          </tr>
        </thead>
        <tbody id="score-input-body">
          <!-- JS动态生成 -->
        </tbody>
      </table>
      <div class="sum-check" id="sum-check">总和: 0</div>
    </div>

    <!-- 已录入的盘数列表 -->
    <div class="rounds-section">
      <h3>已录入盘数</h3>
      <div id="rounds-list" class="rounds-list"></div>
      <button class="btn btn-complete" id="btn-complete-round">本局完成</button>
    </div>
  </section>

  <!-- ========== 玩家管理页 ========== -->
  <section id="tab-players" class="tab-content">
    <div class="add-player-section">
      <div class="add-player-form">
        <input type="text" id="new-player-name" placeholder="输入玩家昵称（同名＝同一人）" maxlength="10">
        <button class="btn btn-add" id="btn-add-player">添加</button>
      </div>
      <div class="player-count">在场 <span id="player-count">0</span> 人 · 档案 <span id="roster-count">0</span> 人</div>
    </div>

    <div class="players-management">
      <ul id="players-list" class="players-list-ui"></ul>
    </div>

    <div class="section-title roster-title">档案库 · 永久</div>
    <div class="roster-wrap">
      <ul id="roster-list" class="players-list-ui roster-list"></ul>
    </div>

    <button class="btn btn-danger btn-reset-all" id="btn-reset-all">重置本次</button>
  </section>

  <!-- ========== 统计页 ========== -->
  <section id="tab-summary" class="tab-content">
    <!-- 走势（时间维度）-->
    <div class="trend-section">
      <div class="section-title">总积分走势 · 按时间</div>
      <div class="trend-card">
        <div id="trend-chart" class="trend-chart"></div>
      </div>
    </div>

    <!-- 本次积分榜 -->
    <div class="leaderboard-section">
      <div class="section-title">本次积分榜</div>
      <div id="leaderboard-list" class="leaderboard-list"></div>
    </div>

    <!-- 永久总榜 -->
    <div class="leaderboard-section">
      <div class="section-title">总排名 · 永久</div>
      <div class="at-board-wrap">
        <div id="alltime-board" class="at-board"></div>
      </div>
    </div>

    <!-- 查分 -->
    <div class="lookup-section">
      <div class="section-title">查分 · 玩家对局</div>
      <select id="lookup-player" class="lookup-select"></select>
      <div id="lookup-result" class="lookup-result"></div>
    </div>

    <!-- 战绩排行 -->
    <div class="stats-section">
      <div class="section-title">总战绩明细 · 永久</div>
      <div class="stats-table-wrap">
        <div id="stats-table" class="stats-table"></div>
      </div>
    </div>

    <!-- 本局详情 -->
    <div class="game-detail-section">
      <div class="section-title"><span class="title-icon">📋</span> 本局详情</div>
      <div id="current-game-detail" class="current-game-detail"></div>
    </div>

    <!-- 历史记录 -->
    <div class="history-section">
      <div class="section-title"><span class="title-icon">📜</span> 历史记录</div>
      <div id="history-list" class="history-list"></div>
    </div>

    <button class="btn btn-complete btn-new-game" id="btn-new-game">开始新的一局</button>
  </section>
</div>

<script src="app.js"></script>
<div class="toast" id="toast"></div>
</body>
</html>
